name: Marcar revisión pendiente

# Uso: después de revisar un documento enlazado desde un issue y dejarle
# comentarios de revisión, corre este workflow con el número de issue y
# la ruta del archivo. Lee el archivo y decide solo qué hacer:
#   - Si tiene comentarios <!-- --> sin el prefijo "c:" (observaciones
#     abiertas): reabre el issue y comenta con el link al documento.
#   - Si todos sus comentarios <!-- --> tienen el prefijo "c:" (ya
#     calificado, sin más oportunidad): cierra el issue con un comentario
#     explícito y el link al documento.
# Uso exclusivo del profesor.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'Número del issue a actualizar'
        required: true
        type: number
      archivo:
        description: 'Ruta del archivo con los comentarios (ej: 02_DHF_Proceso_Diseno/Fase_1_Investigacion/Estado del arte.md)'
        required: true
        type: string
      mensaje:
        description: 'Nota adicional (opcional)'
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  marcar:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que quien ejecuta es el profesor
        if: github.actor != 'oscampo'
        run: |
          echo "::error::Este workflow es de uso exclusivo del profesor."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Leer el archivo y actualizar el issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVO: ${{ inputs.archivo }}
          MENSAJE_EXTRA: ${{ inputs.mensaje }}
          ISSUE: ${{ inputs.issue }}
          REPO: ${{ github.repository }}
        run: |
          if [[ ! -f "$ARCHIVO" ]]; then
            echo "::error::No se encontró el archivo '$ARCHIVO' en el repositorio."
            exit 1
          fi

          encode_path() {
            local path="$1" IFS='/'
            local -a parts encoded
            read -ra parts <<< "$path"
            for part in "${parts[@]}"; do
              encoded+=("$(jq -rn --arg p "$part" '$p|@uri')")
            done
            local result
            result=$(IFS=/; echo "${encoded[*]}")
            echo "$result"
          }

          url="https://github.com/$REPO/blob/main/$(encode_path "$ARCHIVO")"

          todas_lineas="$(grep -n '<!--' "$ARCHIVO" || true)"
          if [[ -z "$todas_lineas" ]]; then
            echo "::error::'$ARCHIVO' no tiene comentarios <!-- -->, nada que reportar."
            exit 1
          fi

          # Comentarios que NO empiezan con "c:" justo después de <!-- --
          # esos son observaciones abiertas, todavía pendientes de corregir.
          pendientes="$(echo "$todas_lineas" | grep -vPi '<!--\s*c:' || true)"

          if [[ -n "$pendientes" ]]; then
            n_pendientes="$(echo "$pendientes" | wc -l | tr -d ' ')"
            body="Acción: issue reabierto (hay ${n_pendientes} comentarios pendientes). Recuerden borrar el texto entre \`<!-- ... -->\` cuando hagan las correcciones. Luego de hacer las correcciones, agreguen un comentario (por ejemplo, \"correcciones hechas\") aquí en el issue y ciérrenlo."
            if [[ -n "$MENSAJE_EXTRA" ]]; then
              body="${body}"$'\n\n'"${MENSAJE_EXTRA}"
            fi
            gh issue reopen "$ISSUE" --repo "$REPO" --comment "$body"
            echo "Acción: issue reabierto (${n_pendientes} comentarios pendientes)."
          else
            body="Issue cerrado para [este documento]($url). No se atendieron los comentarios/observaciones dentro del plazo dado."
            if [[ -n "$MENSAJE_EXTRA" ]]; then
              body="${body}"$'\n\n'"${MENSAJE_EXTRA}"
            fi
            gh issue close "$ISSUE" --repo "$REPO" --comment "$body"
            echo "Acción: issue cerrado (todos los comentarios estaban marcados c:)."
          fi
